spring.datasource.url=${GOVLENS_DB_URL:jdbc:postgresql://localhost:5432/govlens}
spring.datasource.username=${GOVLENS_DB_USER:postgres}
spring.datasource.password=${GOVLENS_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${GOVLENS_DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${GOVLENS_DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${GOVLENS_DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${GOVLENS_DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${GOVLENS_DB_POOL_MAX_LIFETIME_MS:1800000}

spring.flyway.enabled=${GOVLENS_FLYWAY_ENABLED:true}
spring.flyway.locations=${GOVLENS_FLYWAY_LOCATIONS:classpath:db/migration,filesystem:db/migration}

server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.tomcat.connection-timeout=${GOVLENS_TOMCAT_CONNECTION_TIMEOUT:20s}
spring.lifecycle.timeout-per-shutdown-phase=${GOVLENS_SHUTDOWN_TIMEOUT:20s}

govlens.environment=${GOVLENS_ENV:dev}
govlens.cors.allowed-origins=${GOVLENS_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,http://localhost:3000,http://127.0.0.1:3000}
govlens.rate-limit.enabled=${GOVLENS_RATE_LIMIT_ENABLED:true}
govlens.rate-limit.requests-per-window=${GOVLENS_RATE_LIMIT_REQUESTS_PER_WINDOW:120}
govlens.rate-limit.window-seconds=${GOVLENS_RATE_LIMIT_WINDOW_SECONDS:60}
govlens.rate-limit.max-tracked-clients=${GOVLENS_RATE_LIMIT_MAX_TRACKED_CLIENTS:10000}
