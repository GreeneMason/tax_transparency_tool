<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GovLens: Clear, searchable government financial data for residents">
  <meta name="theme-color" content="#0066cc">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>GovLens - Government Financial Transparency</title>

  <!-- Preload critical assets for performance -->
  <link rel="preload" href="/main.[contenthash].js" as="script">
  <link rel="preload" href="/main.[contenthash].css" as="style">

  <!-- Bundled and minified CSS (generated by webpack) -->
  <link rel="stylesheet" href="/main.[contenthash].css">

  <!-- Open Graph / SEO -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://govlens.example.com">
  <meta property="og:title" content="GovLens - Government Financial Transparency">
  <meta property="og:description" content="Search and compare government financial data">
  <meta property="og:image" content="/og-image.png">

  <style>
    /* Minimal critical CSS to avoid FOUC (Flash of Unstyled Content) */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #333333;
    }
    
    .header {
      background: linear-gradient(135deg, #0066cc, #0052a3);
      color: white;
      padding: 1.5rem 1rem;
    }
    
    .header__title {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
    }
    
    .header__subtitle {
      margin: 0.5rem 0 0 0;
      font-size: 1.125rem;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header__content">
      <h1 class="header__title">GovLens</h1>
      <p class="header__subtitle">Clear government financial data for residents</p>
    </div>
  </header>

  <!-- Loading state with skip-to-content link for accessibility -->
  <a href="#main-content" class="skip-to-main">Skip to main content</a>

  <!-- JavaScript will mount the app here -->
  <div id="app"></div>

  <!-- Bundled and minified JS (generated by webpack) -->
  <script src="/main.[contenthash].js" defer></script>
  <script src="/runtime.[contenthash].js" defer></script>

  <!-- Noscript fallback -->
  <noscript>
    <div style="padding: 2rem; text-align: center;">
      <p>This application requires JavaScript to be enabled.</p>
      <p>Please enable JavaScript in your browser settings and try again.</p>
    </div>
  </noscript>
</body>
</html>
